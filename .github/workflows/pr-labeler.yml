name: PR Test Label Manager

on:
  pull_request_target:
    branches: [ main ]
    types: [ opened, synchronize, reopened ]

jobs:
  pr_test_label_manager:
    name: PR Test Label Manager
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'pull_request_target' &&
      contains(fromJson('["opened", "synchronize", "reopened"]'), github.event.action)
    steps:
      # Non-member bots that push same-repo branches; forks never take this path.
      - name: Check if trusted bot
        id: is_trusted_bot
        env:
          SENDER: ${{ github.event.sender.login }}
          SAME_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          result=false
          if [[ "$SAME_REPO" == "true" ]]; then
            case "$SENDER" in
              "dependabot[bot]"|"viam-overwatch[bot]") result=true ;;
            esac
          fi
          echo "result=$result" >> "$GITHUB_OUTPUT"
      - name: Check if organization member
        id: is_organization_member
        if: steps.is_trusted_bot.outputs.result != 'true'
        uses: jamessingleton/is-organization-member@1.0.1
        with:
          organization: viamrobotics
          username: ${{ github.event.sender.login }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Always remove label
        uses: andymckay/labeler@1.0.4
        with:
          repo-token: ${{ secrets.PR_TOKEN }} 
          remove-labels: "safe to test"
      - name: Auto label org members and trusted bots
        if: |
          steps.is_trusted_bot.outputs.result == 'true' ||
          steps.is_organization_member.outputs.result == 'true'
        uses: andymckay/labeler@1.0.4
        with:
          repo-token: ${{ secrets.PR_TOKEN }} 
          add-labels: 'safe to test'
      - name: Add Unsafe PR Comment
        if: |
          steps.is_trusted_bot.outputs.result != 'true' &&
          steps.is_organization_member.outputs.result == 'false'
        uses: marocchino/sticky-pull-request-comment@v2.2.0
        with:
          recreate: true
          message: For security reasons, this PR must be labeled with `safe to test` in order for tests to run.
